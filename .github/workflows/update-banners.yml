name: Atualizar banners

on:
  schedule:
    # Todo dia às 06:17 (UTC)
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  banners:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar banners ASCII
        run: python scripts/build_banners.py

      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg scripts/stats.json
          if git diff --cached --quiet; then
            echo "Sem alterações."
            exit 0
          fi
          git commit -m "chore: atualizar banners [skip ci]"
          git push
